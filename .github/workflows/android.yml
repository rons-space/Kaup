name: Android CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build:

    runs-on: nscloud-ubuntu-24.04-amd64-8x16

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    # ADR-018 requires the exported Room schema for every DATABASE_VERSION to
    # be committed. The build writes it into core/core-data/schemas, so a PR
    # that bumps the version can pull the generated file from this artifact
    # rather than needing an Android SDK locally.
    - name: Upload exported Room schemas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: room-schemas
        path: core/core-data/schemas/
        if-no-files-found: warn
