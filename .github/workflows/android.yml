name: Android CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build:

    runs-on: nscloud-ubuntu-24.04-amd64-8x16

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    # Two JDKs on purpose. Gradle and the compilers run on 26, which is what
    # this project has always built with. The :core-data unit tests are forked
    # onto 17 by a Gradle toolchain, because Robolectric instruments bytecode
    # with ASM and walks the type hierarchy into the running JDK's own classes,
    # so it cannot read a class file from a JDK newer than its bundled ASM
    # understands. On 26 every Robolectric test fails identically in
    # ClassReader before reaching an assertion. The last version listed here is
    # the one that becomes JAVA_HOME, so 26 stays the build JDK.
    - name: set up JDKs
      uses: actions/setup-java@v5
      with:
        java-version: |
          17
          26
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    # ADR-018 requires the exported Room schema for every DATABASE_VERSION to
    # be committed. The build writes it into core/core-data/schemas, so a PR
    # that bumps the version can pull the generated file from this artifact
    # rather than needing an Android SDK locally.
    - name: Upload exported Room schemas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: room-schemas
        path: core/core-data/schemas/
        if-no-files-found: warn

    # ADR-018 says the exported schema for every DATABASE_VERSION is committed,
    # and nothing was checking it. Version 5 was bumped without its schema file
    # and CI stayed green, because the build writes the file it needs into the
    # working tree and never compares it against what is in git. The build above
    # has just regenerated the schemas, so an unclean tree here means either the
    # version was bumped without committing the export, or an entity changed
    # without bumping the version. The artifact uploaded above carries the
    # generated file, so the fix is to download it and commit it.
    # git status rather than git diff: a version bump writes a brand new file,
    # which is untracked, and git diff only reports changes to tracked files.
    # The missing 5.json was exactly that case, so the weaker check would have
    # let it through again.
    - name: Verify exported Room schemas are committed
      run: |
        changes="$(git status --porcelain -- core/core-data/schemas/)"
        if [ -n "$changes" ]; then
          echo "$changes"
          echo "::error::Exported Room schemas differ from the committed ones. Download the room-schemas artifact from this run and commit it. See ADR-018."
          exit 1
        fi
