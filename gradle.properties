org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
android.disallowKotlinSourceSets=false

# Lets Gradle find the JDKs actions/setup-java installs, so the Robolectric
# test toolchain resolves in CI. Missing variables are ignored, so this is
# inert on a developer machine, where auto-detection finds local JDKs anyway.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_26_X64
