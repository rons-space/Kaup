# Pinned rather than inherited from compileSdk. compileSdk is 36 and Robolectric
# ships a preinstrumented android-all jar per API level, so tracking compileSdk
# would make the test suite fail the moment the project moves to an SDK the
# pinned Robolectric release has no jar for. These tests exercise Room and
# coroutines, neither of which behaves differently across these levels, so
# there is nothing to gain from chasing the newest one here.
sdk=34
